<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>OCaml actor trace</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #121a2d;
        --text: #edf3ff;
        --muted: #91a0bd;
        --line: #30405e;
        --run: #55d6be;
        --busy: #ffb454;
        --block: #9b8cff;
        --msg: #ff6685;
        --heap: #55a7ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font: 650 17px system-ui;
        margin: 0 auto 0 0;
      }
      button, select, input {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      input[type="range"] {
        width: min(320px, 40vw);
        accent-color: var(--heap);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        height: calc(100vh - 62px);
      }
      svg {
        width: 100%;
        height: 100%;
        min-height: 480px;
      }
      .edge {
        stroke: var(--line);
        stroke-width: 1;
      }
      .actor {
        fill: var(--panel);
        stroke: var(--run);
        stroke-width: 2;
      }
      .actor.running {
        stroke: var(--busy);
        stroke-width: 3;
      }
      .actor.blocked {
        stroke: var(--block);
        stroke-dasharray: 4 3;
      }
      .actor.exited, .actor.failed {
        opacity: 0.4;
      }
      .heapbg {
        fill: #26344e;
      }
      .heap {
        fill: var(--heap);
      }
      .message {
        fill: var(--msg);
      }
      text {
        fill: var(--text);
        font-size: 11px;
        text-anchor: middle;
        pointer-events: none;
      }
      aside {
        border-left: 1px solid var(--line);
        padding: 16px;
        background: var(--panel);
        overflow: auto;
      }
      aside h2 {
        font: 650 14px system-ui;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 8px 0;
      }
      .muted {
        color: var(--muted);
      }
      #warning {
        color: #ffcf66;
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
      }
      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        svg {
          height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OCaml actor world</h1>
      <button id="play">Pause</button>
      <label>Event <input id="cursor" type="range" min="0" value="0"></label>
      <label>Speed <select id="speed">
          <option>1</option>
          <option>2</option>
          <option>5</option>
          <option>10</option>
        </select>x</label>
      <span id="position" class="muted">waiting for trace</span>
    </header>
    <main>
      <svg
        id="graph"
        role="img"
        aria-label="Actor topology, messages, and heap usage"
      >
      </svg>
      <aside>
        <h2 id="selection">World</h2>
        <div id="details"></div>
        <p id="warning"></p>
        <div class="legend muted">
          <span><i style="background: var(--run)"></i>runnable</span>
          <span><i style="background: var(--busy)"></i>running</span>
          <span><i style="background: var(--block)"></i>blocked</span>
          <span><i style="background: var(--msg)"></i>message</span>
        </div>
      </aside>
    </main>
    <script>
      const svg = document.querySelector("#graph"),
        cursor = document.querySelector("#cursor"),
        play = document.querySelector("#play"),
        speed = document.querySelector("#speed"),
        position = document.querySelector("#position"),
        details = document.querySelector("#details"),
        selection = document.querySelector("#selection"),
        warning = document.querySelector("#warning");
      let events = [],
        playing = true,
        index = 0,
        last = 0,
        selected = null,
        schemaError = "";
      const NS = "http://www.w3.org/2000/svg";
      const node = (name, attrs = {}) => {
        const n = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) {
          n.setAttribute(k, v);
        }
        return n;
      };
      function model() {
        const actors = new Map(), messages = new Map();
        let header = null, footer = null;
        for (const e of events.slice(0, index)) {
          if (e.event === "world_start") header = e;
          if (e.event === "world_end") footer = e;
          if (e.event === "spawn") {
            actors.set(e.actor, {
              ...e,
              state: "runnable",
              mailbox_messages: 0,
              mailbox_bytes: 0,
            });
          }
          if (e.event === "state" && actors.has(e.actor)) {
            Object.assign(actors.get(e.actor), e);
          }
          if (e.event === "send") messages.set(e.message, e);
          if (e.event === "receive" || e.event === "drop") {
            messages.delete(e.message);
          }
          if (e.event === "exit" && actors.has(e.actor)) {
            Object.assign(actors.get(e.actor), {
              state: e.reason === "normal" ? "exited" : "failed",
              reason: e.reason,
            });
          }
        }
        return {
          actors: [...actors.values()],
          messages: [...messages.values()],
          header,
          footer,
        };
      }
      function draw() {
        const m = model(),
          w = Math.max(360, svg.clientWidth),
          h = Math.max(480, svg.clientHeight),
          cx = w / 2,
          cy = h / 2,
          r = Math.min(w, h) * .36;
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        svg.replaceChildren();
        const pos = new Map();
        m.actors.forEach((a, i) => {
          const angle = -Math.PI / 2 +
            (i - 1) * Math.PI * 2 / Math.max(1, m.actors.length - 1);
          pos.set(
            a.actor,
            i === 0
              ? [cx, cy]
              : [cx + Math.cos(angle) * r, cy + Math.sin(angle) * r],
          );
        });
        for (const a of m.actors) {
          if (
            a.actor !== 0 && a.parent !== undefined && pos.has(a.parent)
          ) {
            const [x, y] = pos.get(a.actor),
              [px, py] = pos.get(a.parent);
            svg.append(
              node("line", {
                x1: px,
                y1: py,
                x2: x,
                y2: y,
                class: "edge",
              }),
            );
          }
        }
        for (const msg of m.messages) {
          if (pos.has(msg.sender) && pos.has(msg.receiver)) {
            const [a, b] = [pos.get(msg.sender), pos.get(msg.receiver)];
            svg.append(
              node("circle", {
                cx: (a[0] + b[0]) / 2,
                cy: (a[1] + b[1]) / 2,
                r: 5,
                class: "message",
              }),
            );
          }
        }
        for (const a of m.actors) {
          const [x, y] = pos.get(a.actor),
            g = node("g", {
              transform: `translate(${x} ${y})`,
              tabindex: 0,
            });
          g.style.cursor = "pointer";
          g.onclick = () => {
            selected = a.actor;
            draw();
          };
          g.append(
            node("circle", {
              r: a.actor === 0 ? 30 : 25,
              class: `actor ${a.state || ""}`,
            }),
          );
          g.append(
            node("rect", {
              x: -18,
              y: 8,
              width: 36,
              height: 5,
              rx: 2,
              class: "heapbg",
            }),
          );
          const ratio = Math.min(
            1,
            (a.heap_used || 0) / Math.max(1, a.heap_maximum || 1),
          );
          g.append(
            node("rect", {
              x: -18,
              y: 8,
              width: 36 * ratio,
              height: 5,
              rx: 2,
              class: "heap",
            }),
          );
          const t = node("text", { y: -2 });
          t.textContent = a.actor === 0
            ? "root"
            : `a${a.actor % 65536}#${Math.floor(a.actor / 65536)}`;
          g.append(t);
          const p = node("text", { y: 24 });
          p.textContent = `${Math.round(ratio * 100)}%`;
          g.append(p);
          svg.append(g);
        }
        const picked = m.actors.find((a) => a.actor === selected);
        selection.textContent = picked
          ? (picked.actor === 0 ? "root" : `actor ${picked.actor}`)
          : "World";
        const rows = picked
          ? {
            state: picked.state,
            heap_used: picked.heap_used,
            heap_capacity: picked.heap_capacity,
            heap_maximum: picked.heap_maximum,
            mailbox_messages: picked.mailbox_messages,
            mailbox_bytes: picked.mailbox_bytes,
            growths: picked.growths,
            collections: picked.collections,
          }
          : {
            actors: m.actors.length,
            messages_in_flight: m.messages.length,
            schema: m.header?.schema,
            outcome: m.footer?.outcome,
          };
        details.innerHTML = Object.entries(rows).map(([k, v]) =>
          `<div class="row"><span class="muted">${k}</span><span>${
            v ?? "-"
          }</span></div>`
        ).join("");
        warning.textContent = schemaError ||
          (m.footer && !m.footer.complete
            ? `Incomplete trace: ${m.footer.events_dropped} events dropped`
            : "");
        position.textContent = `${index} / ${events.length} events`;
        cursor.max = events.length;
        cursor.value = index;
      }
      cursor.oninput = () => {
        playing = false;
        play.textContent = "Play";
        index = Number(cursor.value);
        draw();
      };
      play.onclick = () => {
        playing = !playing;
        play.textContent = playing ? "Pause" : "Play";
      };
      async function refresh() {
        try {
          const text =
            await (await fetch("/trace", { cache: "no-store" })).text();
          const parsed = text.trim().split("\n").filter(Boolean)
              .flatMap((line) => {
                try {
                  return [JSON.parse(line)];
                } catch {
                  return [];
                }
              }),
            header = parsed.find((e) => e.event === "world_start");
          if (header && header.schema !== 1) {
            schemaError = `Unsupported trace schema ${header.schema}`;
            events = [];
            index = 0;
          } else {
            schemaError = "";
            const atEnd = index >= events.length;
            events = parsed;
            if (atEnd) index = events.length;
          }
          draw();
        } catch {}
        setTimeout(refresh, 500);
      }
      function frame(now) {
        if (
          playing && events.length &&
          now - last > 220 / Number(speed.value)
        ) {
          index = Math.min(events.length, index + 1);
          last = now;
          draw();
        }
        requestAnimationFrame(frame);
      }
      new ResizeObserver(draw).observe(svg);
      refresh();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
